[package]
name = "easy-espanso"
version = "1.4.0"
description = "Easy Espanso configuration editor"
authors = ["Easy Espanso Team"]
edition = "2021"

[lib]
name = "easy_espanso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi"] }

[features]
# 发布构建通过 tauri CLI 自动启用；缺失会导致前端资源不嵌入 exe（运行时白屏）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"      # 优先体积
lto = true
codegen-units = 1
strip = true
panic = "abort"
